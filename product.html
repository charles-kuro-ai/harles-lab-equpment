<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title id="page-title">Product Detail — Harles Lab Equipment</title>
  <meta id="page-description" name="description" content="Laboratory equipment product detail — Harles Lab Equipment, Port Harcourt, Nigeria.">
  <meta name="robots" content="index, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: { DEFAULT: '#102B46', 500: '#102B46', 600: '#0D2337' },
            teal: { DEFAULT: '#167D9A', 400: '#208FB0', 500: '#167D9A', 600: '#11637A' },
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    :root{--color-navy:#102B46;--color-teal:#167D9A}
    .container-xl{max-width:80rem;margin:0 auto;padding:0 1rem}
    @media(min-width:640px){.container-xl{padding:0 1.5rem}}
    @media(min-width:1024px){.container-xl{padding:0 2rem}}
    :focus-visible{outline:2px solid #167D9A;outline-offset:2px}
    .skip-link{position:absolute;top:-100%;left:1rem;padding:.5rem 1rem;background:#102B46;color:#fff;border-radius:6px;font-size:.875rem;font-weight:600;z-index:100}
    .skip-link:focus{top:1rem}
    .mobile-nav-overlay,.mobile-nav-panel,.back-to-top{--dummy:0}
    .mobile-nav-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
    .mobile-nav-overlay.open{opacity:1;pointer-events:auto}
    .mobile-nav-panel{position:fixed;top:0;right:0;height:100%;width:18rem;max-width:85vw;background:#fff;z-index:40;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s;box-shadow:0 25px 50px rgba(0,0,0,.25)}
    .mobile-nav-panel.open{transform:translateX(0)}
    .back-to-top{position:fixed;bottom:1.5rem;right:1.5rem;width:2.5rem;height:2.5rem;background:#102B46;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;cursor:pointer;border:none}
    .back-to-top.visible{opacity:1;pointer-events:auto}
    .nav-link-active{color:#102B46;font-weight:600}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body class="bg-white text-slate-800 font-sans antialiased">

  <div id="site-header"></div>

  <main id="main-content">
    <!-- Product content rendered by JS -->
    <div id="product-content">
      <!-- Loading state -->
      <div id="product-loading" class="container-xl py-20 text-center">
        <div class="inline-block w-8 h-8 border-2 border-teal-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-sm text-slate-500">Loading product…</p>
      </div>

      <!-- Not found state (hidden initially) -->
      <div id="product-not-found" class="hidden container-xl py-20 text-center">
        <svg class="w-14 h-14 text-slate-200 mx-auto mb-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <h1 class="text-2xl font-bold text-navy-500 mb-3">Product Not Found</h1>
        <p class="text-slate-500 mb-8">The product you're looking for is not available or may have been removed.</p>
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
          <a href="/products.html" class="inline-flex items-center gap-2 bg-teal-500 hover:bg-teal-600 text-white font-semibold px-6 py-2.5 rounded-md transition-colors text-sm">
            Browse all products
          </a>
          <a href="/contact.html" class="inline-flex items-center gap-2 border border-gray-200 text-navy-500 hover:bg-slate-50 font-semibold px-6 py-2.5 rounded-md transition-colors text-sm">
            Contact us
          </a>
        </div>
      </div>

      <!-- Product detail (hidden initially) -->
      <div id="product-detail" class="hidden">
        <!-- Rendered by JS -->
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/products.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/catalogue.js"></script>
  <script src="/assets/js/product-detail.js"></script>
</body>
</html>
